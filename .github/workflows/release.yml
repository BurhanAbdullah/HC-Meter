name: Build SYSWATCH release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Build Debian package with shared builder
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          bash packaging/build_deb.sh "$VERSION" "$GITHUB_SHA"
      - name: Verify Debian package and reproducibility
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE="syswatch_${VERSION}_amd64.deb"
          cp "$PACKAGE" first-build.deb
          dpkg-deb --info "$PACKAGE"
          dpkg-deb --contents "$PACKAGE" >/dev/null
          dpkg-deb --control "$PACKAGE" control
          grep -q '^Package: syswatch$' control/control
          grep -q '^Version:' control/control
          grep -q '^Depends: python3, systemd, passwd$' control/control
          test -f control/postrm
          grep -q 'User=syswatch' control/postinst
          grep -q 'ProtectSystem=strict' control/postinst
          grep -q 'CapabilityBoundingSet=' control/postinst
          grep -q 'AmbientCapabilities=' control/postinst
          sha256sum --check SHA256SUMS

          # Rebuild through the exact same repository builder and compare bytes.
          bash packaging/build_deb.sh "$VERSION" "$GITHUB_SHA"
          cmp --silent first-build.deb "$PACKAGE"
      - name: Attest Debian package provenance
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-path: 'syswatch_*.deb'
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            syswatch_*.deb
            SHA256SUMS
            RELEASE-METADATA.txt
