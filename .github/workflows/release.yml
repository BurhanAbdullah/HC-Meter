name: Build SYSWATCH release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ROOT="pkg/syswatch_${VERSION}_amd64"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          rm -rf pkg
          mkdir -p "$ROOT/DEBIAN" "$ROOT/opt/syswatch" "$ROOT/usr/local/bin"
          git archive --format=tar --prefix=syswatch/ "$GITHUB_SHA" | tar -x -C "$ROOT/opt/syswatch"
          mv "$ROOT/opt/syswatch/syswatch"/* "$ROOT/opt/syswatch/"
          rmdir "$ROOT/opt/syswatch/syswatch"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: syswatch
          Version: ${VERSION}
          Section: admin
          Priority: optional
          Architecture: amd64
          Depends: python3, systemd, passwd
          Maintainer: Burhan Abdullah
          Description: SYSWATCH PRO host security monitoring
           Local-first host security monitoring and intrusion detection dashboard.
          EOF
          cat > "$ROOT/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if ! getent group syswatch >/dev/null; then
            groupadd --system syswatch
          fi
          if ! getent passwd syswatch >/dev/null; then
            useradd --system --gid syswatch --home-dir /var/lib/syswatch --no-create-home --shell /usr/sbin/nologin syswatch
          fi
          install -d -m 0750 -o syswatch -g syswatch /var/lib/syswatch
          chown -R root:root /opt/syswatch
          cat > /etc/systemd/system/syswatch.service <<SERVICE
          [Unit]
          Description=SYSWATCH Pro Host Security Monitor
          After=network.target
          [Service]
          Type=simple
          User=syswatch
          Group=syswatch
          WorkingDirectory=/opt/syswatch
          Environment=SYSWATCH_STATE_DIR=/var/lib/syswatch
          ExecStart=/usr/bin/python3 /opt/syswatch/syswatch/api/server.py
          Restart=on-failure
          RestartSec=3
          UMask=0077
          NoNewPrivileges=true
          PrivateTmp=true
          PrivateDevices=true
          ProtectSystem=strict
          ProtectHome=read-only
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          RestrictSUIDSGID=true
          LockPersonality=true
          RestrictRealtime=true
          CapabilityBoundingSet=
          AmbientCapabilities=
          ReadWritePaths=/var/lib/syswatch
          StateDirectory=syswatch
          [Install]
          WantedBy=multi-user.target
          SERVICE
          cat > /usr/local/bin/syswatch <<'CMD'
          #!/bin/sh
          case "${1:-start}" in
            start) systemctl start syswatch.service; echo "SYSWATCH: http://127.0.0.1:8080" ;;
            stop) systemctl stop syswatch.service ;;
            restart) systemctl restart syswatch.service ;;
            status) systemctl --no-pager status syswatch.service ;;
            logs) journalctl -u syswatch.service -n 100 --no-pager ;;
            open) xdg-open http://127.0.0.1:8080 2>/dev/null || true ;;
            *) echo "Usage: syswatch {start|stop|restart|status|logs|open}"; exit 2 ;;
          esac
          CMD
          chmod 0755 /usr/local/bin/syswatch
          cat > /usr/local/bin/syswatch-signal <<'SIGNAL'
          #!/bin/sh
          set -e
          export SYSWATCH_STATE_DIR="${SYSWATCH_STATE_DIR:-/var/lib/syswatch}"
          exec /opt/syswatch/syswatch/agents/feed_signal.sh "$@"
          SIGNAL
          chmod 0755 /usr/local/bin/syswatch-signal
          systemctl daemon-reload
          systemctl enable syswatch.service
          systemctl restart syswatch.service || systemctl start syswatch.service
          EOF
          chmod 755 "$ROOT/DEBIAN/postinst"
          cat > "$ROOT/DEBIAN/postrm" <<'EOF'
          #!/bin/sh
          set -e
          case "${1:-}" in
            remove)
              systemctl disable --now syswatch.service 2>/dev/null || true
              rm -f /etc/systemd/system/syswatch.service /usr/local/bin/syswatch /usr/local/bin/syswatch-signal
              systemctl daemon-reload 2>/dev/null || true
              ;;
            purge)
              systemctl disable --now syswatch.service 2>/dev/null || true
              rm -f /etc/systemd/system/syswatch.service /usr/local/bin/syswatch /usr/local/bin/syswatch-signal
              rm -rf /var/lib/syswatch
              if getent passwd syswatch >/dev/null; then userdel syswatch 2>/dev/null || true; fi
              if getent group syswatch >/dev/null; then groupdel syswatch 2>/dev/null || true; fi
              systemctl daemon-reload 2>/dev/null || true
              ;;
          esac
          EOF
          chmod 755 "$ROOT/DEBIAN/postrm"
          # Normalize every package file timestamp so the archive does not
          # depend on the wall-clock time of the release runner.
          find "$ROOT" -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +
          SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" dpkg-deb --build "$ROOT"
          mv "pkg/syswatch_${VERSION}_amd64.deb" .
          sha256sum "syswatch_${VERSION}_amd64.deb" > SHA256SUMS
          printf 'SYSWATCH %s\nCommit %s\nSource-Date-Epoch %s\n' "$VERSION" "$GITHUB_SHA" "$SOURCE_DATE_EPOCH" > RELEASE-METADATA.txt
      - name: Verify Debian package
        shell: bash
        run: |
          set -euo pipefail
          dpkg-deb --info syswatch_*.deb
          dpkg-deb --contents syswatch_*.deb >/dev/null
          dpkg-deb --control syswatch_*.deb control
          grep -q '^Package: syswatch$' control/control
          grep -q '^Version:' control/control
          grep -q '^Depends: python3, systemd, passwd$' control/control
          test -f control/postrm
          grep -q 'User=syswatch' control/postinst
          grep -q 'ProtectSystem=strict' control/postinst
          grep -q 'CapabilityBoundingSet=' control/postinst
          grep -q 'AmbientCapabilities=' control/postinst
          sha256sum --check SHA256SUMS
      - name: Attest Debian package provenance
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-path: 'syswatch_*.deb'
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            syswatch_*.deb
            SHA256SUMS
            RELEASE-METADATA.txt
