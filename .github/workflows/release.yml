name: Build SYSWATCH release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git diff --quiet "${GITHUB_SHA}"^ "${GITHUB_SHA}" -- . ':!site' || true
      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ROOT="pkg/syswatch_${VERSION}_amd64"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/opt/syswatch" "$ROOT/usr/local/bin"
          cp -a . "$ROOT/opt/syswatch/"
          rm -rf "$ROOT/opt/syswatch/.git" "$ROOT/opt/syswatch/pkg"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: syswatch
          Version: ${VERSION}
          Section: admin
          Priority: optional
          Architecture: amd64
          Maintainer: Burhan Abdullah
          Description: SYSWATCH PRO host security monitoring
           Local-first host security monitoring and intrusion detection dashboard.
          EOF
          cat > "$ROOT/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          chmod +x /opt/syswatch/install.sh /opt/syswatch/syswatch/cmd/syswatch 2>/dev/null || true
          cat > /etc/systemd/system/syswatch.service <<SERVICE
          [Unit]
          Description=SYSWATCH Pro Host Security Monitor
          After=network.target
          [Service]
          Type=simple
          WorkingDirectory=/opt/syswatch
          ExecStart=/usr/bin/python3 /opt/syswatch/syswatch/api/server.py
          Restart=on-failure
          RestartSec=3
          NoNewPrivileges=true
          ProtectHome=read-only
          [Install]
          WantedBy=multi-user.target
          SERVICE
          cat > /usr/local/bin/syswatch <<'CMD'
          #!/bin/sh
          case "${1:-start}" in
            start) systemctl start syswatch.service; echo "SYSWATCH: http://127.0.0.1:8080" ;;
            stop) systemctl stop syswatch.service ;;
            restart) systemctl restart syswatch.service ;;
            status) systemctl --no-pager status syswatch.service ;;
            logs) journalctl -u syswatch.service -n 100 --no-pager ;;
            open) xdg-open http://127.0.0.1:8080 2>/dev/null || true ;;
            *) echo "Usage: syswatch {start|stop|restart|status|logs|open}"; exit 2 ;;
          esac
          CMD
          chmod +x /usr/local/bin/syswatch
          systemctl daemon-reload
          systemctl enable syswatch.service
          systemctl restart syswatch.service || systemctl start syswatch.service
          EOF
          chmod 755 "$ROOT/DEBIAN/postinst"
          dpkg-deb --build "$ROOT"
          mv "pkg/syswatch_${VERSION}_amd64.deb" .
          sha256sum "syswatch_${VERSION}_amd64.deb" > SHA256SUMS
          printf 'SYSWATCH %s\nCommit %s\n' "$VERSION" "$GITHUB_SHA" > RELEASE-METADATA.txt
      - name: Verify Debian package
        shell: bash
        run: |
          set -euo pipefail
          dpkg-deb --info syswatch_*.deb
          dpkg-deb --contents syswatch_*.deb >/dev/null
          sha256sum --check SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            syswatch_*.deb
            SHA256SUMS
            RELEASE-METADATA.txt
