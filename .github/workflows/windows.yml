name: SYSWATCH Windows validation

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-executable:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller==6.15.0
      - name: Build one-file executable
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm packaging/syswatch_windows.spec
      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\syswatch.exe'
          if (!(Test-Path $exe)) { throw 'syswatch.exe was not produced' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "SYSWATCH Windows executable SHA256: $hash"
      - name: Smoke-test executable and localhost API
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\syswatch.exe'
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/health' -Headers @{ Host = '127.0.0.1:8080' }
                if ($health.ok -eq $true -and $health.service -eq 'syswatch') { $healthy = $true; break }
              } catch {}
            }
            if (!$healthy) { throw 'Windows executable did not expose the expected local health contract' }
            $metrics = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/metrics' -Headers @{ Host = '127.0.0.1:8080' }
            if ($null -eq $metrics.hostname -or $null -eq $metrics.firewall) { throw 'Windows metrics contract incomplete' }
            $processes = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/processes' -Headers @{ Host = '127.0.0.1:8080' }
            if ($null -eq $processes.processes) { throw 'Windows process contract incomplete' }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
