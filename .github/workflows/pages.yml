name: Validate SYSWATCH website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate staged site
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -s site/index.html

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          site = Path('site')
          index = site / 'index.html'
          text = index.read_text(encoding='utf-8')

          required = (
              'SYSWATCH',
              'Ubuntu 24.04',
              'local-first',
              'GitHub',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing required site content: {missing}')

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      href = dict(attrs).get('href')
                      if href:
                          self.links.append(href)

          parser = LinkParser()
          parser.feed(text)

          for href in parser.links:
              if href.startswith(('#', 'http://', 'https://', 'mailto:')):
                  continue
              target = (site / href.split('#', 1)[0].split('?', 1)[0]).resolve()
              if site.resolve() not in target.parents and target != site.resolve():
                  raise SystemExit(f'link escapes site root: {href}')
              if not target.exists():
                  raise SystemExit(f'broken local link: {href}')

          print(f'validated {index} with {len(parser.links)} links')
          PY

      - name: Confirm pre-release deployment remains disabled
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'actions/(configure-pages|deploy-pages|upload-pages-artifact)@' .github/workflows/pages.yml; then
            echo 'Pages deployment action found before release gate cleared' >&2
            exit 1
          fi
