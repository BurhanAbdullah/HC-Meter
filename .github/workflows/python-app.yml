name: SYSWATCH CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install test tools
        run: python -m pip install --upgrade pip flake8
      - name: Syntax check
        run: python -m py_compile syswatch/api/server.py
      - name: Lint critical errors
        run: flake8 syswatch/api/server.py --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Application smoke test
        run: bash tests/smoke_test.sh
