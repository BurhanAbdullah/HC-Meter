name: SYSWATCH validation

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run unit and adversarial synthetic tests
        run: python -m pytest -q
      - name: Validate shell syntax
        run: bash -n install.sh syswatch/agents/feed_signal.sh
      - name: Enforce immutable workflow action references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          pattern = re.compile(r"^\s*-?\s*uses:\s*[^@\s]+@([^\s#]+)")
          bad = []
          for path in Path('.github/workflows').rglob('*.yml'):
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  match = pattern.match(line)
                  if match and not re.fullmatch(r'[0-9a-fA-F]{40}', match.group(1)):
                      bad.append(f'{path}:{lineno}: {match.group(1)}')
          if bad:
              print('Unpinned GitHub Action references:')
              print('\n'.join(bad))
              raise SystemExit(1)
          print('All GitHub Action references are pinned to full commit SHAs.')
          PY
