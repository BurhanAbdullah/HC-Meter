<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SYSWATCH // Security Operations</title><link rel="manifest" href="/manifest.webmanifest"><style>
:root{--bg:#071016;--panel:#0c1820;--line:#18303b;--text:#d8e7eb;--muted:#71909b;--good:#3ee38b;--warn:#ffc857;--bad:#ff5577;--cyan:#39d5ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#10303a 0,#071016 35%);color:var(--text);font:13px ui-monospace,SFMono-Regular,Consolas,monospace}header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;background:#071016eF;backdrop-filter:blur(10px);z-index:3}.brand{font-weight:800;letter-spacing:2px;color:#fff}.brand span{color:var(--cyan)}.status{color:var(--good)}main{padding:18px;max-width:1600px;margin:auto}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:#0b171fdd;border:1px solid var(--line);border-radius:8px;padding:15px;box-shadow:0 10px 30px #0004}.metric{grid-column:span 3}.wide{grid-column:span 8}.side{grid-column:span 4}.full{grid-column:1/-1}h3{margin:0 0 12px;font-size:11px;color:var(--muted);letter-spacing:1.5px}.value{font-size:29px;font-weight:700}.bar{height:5px;background:#13252d;margin-top:12px;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cyan);width:0}.risk{font-size:38px}.risk.low{color:var(--good)}.risk.medium{color:var(--warn)}.risk.high,.risk.critical{color:var(--bad)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #12303a}th{color:var(--muted);font-size:10px}.pill{padding:3px 7px;border:1px solid currentColor;border-radius:10px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}button{background:#0d2933;border:1px solid #245261;color:var(--text);padding:9px 12px;border-radius:5px;cursor:pointer}button:hover{border-color:var(--cyan)}pre{white-space:pre-wrap;max-height:350px;overflow:auto;color:#9cc0c9}.chain{border-left:2px solid var(--bad);padding:9px 12px;margin:8px 0;background:#ff557708}.muted{color:var(--muted)}@media(max-width:900px){.metric,.wide,.side{grid-column:1/-1}}
</style></head><body><header><div class="brand">SYSWATCH <span>PRO</span> // SOC</div><div class="status">● AGENT ONLINE <span id="clock"></span></div></header><main><div class="grid">
<div class="card metric"><h3>CPU</h3><div class="value" id="cpu">—</div><div class="bar"><i id="cpub"></i></div></div><div class="card metric"><h3>MEMORY</h3><div class="value" id="mem">—</div><div class="bar"><i id="memb"></i></div></div><div class="card metric"><h3>DISK</h3><div class="value" id="disk">—</div><div class="bar"><i id="diskb"></i></div></div><div class="card metric"><h3>PROCESSES</h3><div class="value" id="procs">—</div></div>
<div class="card side"><h3>AI THREAT LEVEL</h3><div class="risk low" id="risk">LOW</div><div class="muted" id="score">score 0</div></div><div class="card wide"><h3>ACTIVE CAUSAL CHAINS</h3><div id="chains" class="muted">No active chains.</div></div>
<div class="card wide"><h3>NETWORK / LISTENING ENDPOINTS</h3><table><thead><tr><th>ENDPOINT</th></tr></thead><tbody id="ports"></tbody></table></div><div class="card side"><h3>ACTIONS</h3><button onclick="scan()">RUN SECURITY SCAN</button> <button onclick="refresh()">REFRESH</button><div id="scan" class="muted" style="margin-top:12px"></div></div>
<div class="card full"><h3>SECURITY EVENT STREAM</h3><div id="events" class="muted">Waiting for telemetry…</div></div></div></main>
<script>const $=x=>document.getElementById(x);function pct(id,b,v){$(id).textContent=v+'%';$(b).style.width=Math.max(0,Math.min(100,v))+'%'}async function refresh(){try{let m=await fetch('/api/metrics').then(r=>r.json());pct('cpu','cpub',m.cpu);pct('mem','memb',m.memory);pct('disk','diskb',m.disk);$('procs').textContent=m.processes; $('ports').innerHTML=(m.ports||[]).map(x=>'<tr><td>'+x.replaceAll('<','&lt;')+'</td></tr>').join('');let a=await fetch('/api/agent').then(r=>r.json());$('score').textContent='score '+a.score+' / confidence '+Math.round(a.confidence*100)+'%';$('risk').textContent=a.level;$('risk').className='risk '+a.level.toLowerCase();$('chains').innerHTML=(a.chains||[]).map(c=>'<div class="chain"><b>'+c.name+'</b> — '+Math.round(c.confidence*100)+'%<br><span class="muted">'+c.stage+' · '+c.tactic+'</span></div>').join('')||'No active chains.';$('events').innerHTML=(a.events||[]).slice(-20).reverse().map(e=>'<div><span class="muted">'+new Date(e.ts*1000).toLocaleTimeString()+'</span> <span class="'+(e.severity==='CRITICAL'?'bad':e.severity==='HIGH'?'warn':'good')+'">['+e.severity+']</span> '+e.type+' — '+e.detail+'</div>').join('')||'No events.';$('clock').textContent=new Date().toLocaleTimeString()}catch(e){$('events').textContent='Telemetry unavailable: '+e}}async function scan(){try{$('scan').textContent='Scanning…';let x=await fetch('/api/scan',{method:'POST'});let r=await x.json();$('scan').textContent=r.ok?'Scan completed':'Scan failed: '+(r.error||r.exit_code);refresh()}catch(e){$('scan').textContent='Scan failed: '+e}}refresh();setInterval(refresh,3000)</script></body></html>
